[package]
name = "horizon-telemetry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Opt-in data collection: the player's consent, the payloads, the local outbox and its upload"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# zstd in pure Rust: batches are compressed before they leave and checked when they arrive.
ruzstd = "0.9"
# The random install ID and outbox file names.
getrandom = "0.3"
# Compatibility feature names only. This crate has no HTTP dependency or transport.
[features]
default = ["upload", "live"]
upload = []
live = []

[[test]]
name = "consent_gating"
required-features = ["upload"]

[lints]
workspace = true
